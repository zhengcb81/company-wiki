questions:
  GPU与AI芯片:
  - 各家GPU产品性能对比如何？
  - 国产AI芯片替代进展？
  - GPU供需格局和价格趋势？
  - AI芯片架构创新方向？
  半导体设备:
  - 各环节设备国产化率？
  - 先进制程设备进展？
  - 大客户订单和扩产计划？
  - 美国制裁对设备出口的影响？
  半导体材料:
  - 各环节材料国产化率？
  - 大硅片、光刻胶等关键材料突破？
  - 原材料价格波动影响？
  半导体代工:
  - 先进制程产能利用率？
  - 成熟制程竞争格局？
  - 各厂商扩产计划和资本开支？
  封测:
  - 先进封装(CoWoS/HBM)产能？
  - 封测厂商订单能见度？
  - Chiplet技术进展？
  EDA与IP:
  - 国产EDA工具覆盖度？
  - AI辅助EDA技术进展？
  光模块:
  - 800G/1.6T产品出货节奏？
  - CPO技术商用进展？
  - 海外云厂商资本开支趋势？
  液冷:
  - 液冷渗透率提升趋势？
  - 浸没式vs冷板式技术路线？
  - 数据中心液冷改造需求？
  算力基建:
  - 国内智算中心建设进度？
  - AI服务器出货量和ASP趋势？
  - 算力租赁商业模式？
  电力基建:
  - 数据中心电力需求增长？
  - 储能配套比例？
  - 特高压/智能电网建设？
  AI应用:
  - 大模型能力演进？
  - AI应用商业化进展？
  - Agent/工作流自动化落地？
  密封件:
  - 下游需求景气度如何？
  - 国产替代进展？
  - 重大订单或技术突破？
