# Local pre-commit gate mirroring the CI quality workflow's fast checks.
# Pins match CI exactly (ruff 0.15.18, mypy 1.19.0 via the local system).
# Commits run static checks only. Pushes run affected Unit files plus the CI
# smoke set once; wide, dynamic or unknown scopes run the smoke set only and
# defer the full unit suite to CI (local_fast_pass, full_validation_pending).
# CI runs all Unit tests. Major implementation nodes run their relevant
# integration and end-to-end tests.
#
#   pre-commit install   # once per clone (installs .git/hooks/pre-commit)
#   pre-commit run --all-files   # full gate on demand
repos:
  - repo: local
    hooks:
      - id: dependency-declarations
        name: runtime dependency declaration parity
        entry: python tools/check_dependencies.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|requirements[^/]*\.txt|tools/check_dependencies\.py)$

      - id: ruff
        name: ruff check (WU-1.2, mirrors CI)
        entry: ruff check
        language: system
        types: [python]
        # CI scope plus the narrative runtime integration fixture and its model port.
        files: ^(src/|tests/unit/|tests/contract/|tests/e2e/|scripts/).*\.py$|^tests/integration/test_narrative_runtime_e2e\.py$|^tests/support/narrative_model_fixture\.py$|^tools/(check_dependencies|changed_unit_tests|pre_push_gate|summarize_junit_failures)\.py$

      - id: mypy-contract
        name: mypy runtime source (same command as CI)
        entry: python -m mypy src
        language: system
        pass_filenames: false
        # follow_imports=skip loses cross-module signatures for a subset input.
        # One cached source check replaces the fixed list; no behavior tests.
        files: ^src/.*\.py$
      - id: config-doctor
        name: config doctor (WU-7.1, mirrors CI)
        entry: >-
          python -c "import sys, runpy; sys.path.insert(0, 'src');
          sys.argv=['scripts/config_doctor.py', '--structure-only'];
          runpy.run_path('scripts/config_doctor.py', run_name='__main__')"
        language: system
        pass_filenames: false
        files: >-
          (?x)^(config\.yaml$|config/|
          scripts/(config|config_doctor)\.py$|
          src/company_wiki/(config\.py$|source_catalog/[^/]*config[^/]*\.py$))

      # FC-1307-a: the host-assumption classes that passed every local hook and
      # broke CI (findings F-B01-9) - a host path baked into a test, an unguarded
      # capability call.  The hash whitelist is retired: source digests are data,
      # verified by the reader rather than a manual registration.  This scans
      # tests/ and src/ (not the whole tree) and takes no filenames; rule 1 is
      # scoped to tests/ on purpose, see the script's docstring for the honest
      # scope (it does NOT cover assertion-layer host dependence).
      - id: host-assumption-guard
        name: host assumption guard (FC-1307-a, mirrors the CI contract test)
        entry: python scripts/host_assumption_guard.py
        language: system
        pass_filenames: false
        files: ^(tests/|src/).*\.py$
