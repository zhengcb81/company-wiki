schema_version: "1.0"
catalog_dir: "${PROJECT_ROOT}/.source_catalog"
# Root *kinds* whose indexed documents are directly reusable by filing-fetch
# (config-driven, ADR-008). company_raw is the default; adding a kind here
# makes every already-indexed document under such roots reusable without a
# download (filing-fetch path allowance must list the corresponding dirs).
reusable_root_kinds: [company_raw, dayu_portfolio, directory]
roots:
  - root_id: company_raw
    kind: company_raw
    path: "${PROJECT_ROOT}/companies"
    priority: 10
  - root_id: dayu_portfolio
    kind: dayu_portfolio
    path: "${PROJECT_ROOT}/../dayu-agent/workspace/portfolio"
    priority: 20
  - root_id: dropbox_stock
    kind: directory
    path: "${USER_PROFILE}/Dropbox/Stock"
    priority: 30
  # ZR-409 (EX-08): a future root joins by CONFIG ONLY — kind directory +
  # registered sidecar adapter, read-only, reusable.  No product code change
  # is needed for a new root (the whole point of the adapter registry).
  - root_id: future_lake
    kind: directory
    path: "${PROJECT_ROOT}/future_lake"
    adapter_id: sidecar_filing_v1
    read_only: true
    reusable_for_filing: true
    priority: 40
