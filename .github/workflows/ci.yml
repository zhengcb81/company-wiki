name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, "codex/architecture-*", "codex/s6-p1-*"]
    paths-ignore:
      - "docs/plans/**"
      - ".planning/**"
      - "docs/**/*.md"
      - "*.md"
      - "integration/**"
      - "tools/run_source_system_tests.py"
      - ".github/workflows/source-system.yml"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/plans/**"
      - ".planning/**"
      - "docs/**/*.md"
      - "*.md"
      - "integration/**"
      - "tools/run_source_system_tests.py"
      - ".github/workflows/source-system.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline checks (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    env:
      CWP_CI_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: "1"
      PYTHON_DOTENV_DISABLED: "1"
      COMPANY_WIKI_NETWORK: "blocked"
      COMPANY_WIKI_REAL_LLM: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CWP_CI_REVISION }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt "ruff==0.15.18"

      - name: Ruff lint
        if: matrix.shard == 0 && matrix.platform == 'linux'
        run: ruff check src tests/unit tests/contract tests/e2e scripts tests/integration/test_narrative_runtime_e2e.py tests/integration/test_transport_normalization_injection.py tests/support/narrative_model_fixture.py tools/check_dependencies.py tools/changed_unit_tests.py tools/pre_push_gate.py tools/summarize_junit_failures.py tools/source_case_receipt.py tools/source_case_checks.py tools/source_case_runner.py tools/run_ci_evidence.py tools/ci_shards.py tools/anti_trick_gate_spec

      - name: Strict type check on src
        if: matrix.shard == 0 && matrix.platform == 'linux'
        run: python -m mypy src

      - name: Compileall and config doctor
        if: matrix.shard == 0
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src scripts tests
          python scripts/config_doctor.py

      - name: Collect one canonical applicable inventory
        if: matrix.shard == 0
        run: >-
          python -m tools.run_ci_evidence --collect --revision "${{ env.CWP_CI_REVISION }}"
          --output "${{ runner.temp }}/cwp-evidence/${{ matrix.platform }}-inventory"

      - name: Execute this offline pytest shard
        run: >-
          python -m tools.run_ci_evidence --shard "${{ matrix.shard }}/8"
          --revision "${{ env.CWP_CI_REVISION }}"
          --output "${{ runner.temp }}/cwp-evidence/${{ matrix.platform }}-${{ matrix.shard }}"

      - name: Keep collected and executed node IDs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwp-test-evidence-${{ matrix.platform }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/cwp-evidence/
          retention-days: 7
          if-no-files-found: error

      - name: CLI smoke test
        if: matrix.shard == 0
        shell: bash
        run: |
          python scripts/snapshot_manifest.py --help
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "scripts/collect_news.py", "--help"],
              capture_output=True,
              text=True,
              check=False,
          )
          assert result.returncode == 78, (
              f"expected retired writer exit 78, got {result.returncode}: "
              f"{result.stdout}{result.stderr}"
          )
          assert "LEGACY WRITER BLOCKED" in result.stdout
          print("collect_news legacy writer remains blocked (exit 78)")
          PY

      - name: Scan for hardcoded secrets
        if: matrix.shard == 0 && matrix.platform == 'linux'
        shell: bash
        run: |
          if grep -rn 'sk-[0-9a-f]\{32\}' src/ scripts/ tests/ tools/ --include="*.py" | grep -v "test\|example\|placeholder\|your_" >/dev/null; then
            echo "Potential hardcoded API key found"
            exit 1
          fi
          if grep -rn 'tvly-dev-[a-zA-Z0-9]\{20,\}' src/ scripts/ tests/ tools/ --include="*.py" | grep -v "test\|example\|placeholder\|your_" >/dev/null; then
            echo "Potential hardcoded Tavily key found"
            exit 1
          fi
          echo "No hardcoded secrets found"

  coverage:
    name: Verify actual offline execution on both platforms
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CWP_CI_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CWP_CI_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: cwp-test-evidence-*
          path: cwp-evidence
          merge-multiple: true
      - name: Match same-version inventories to executed node IDs
        run: >-
          python -m tools.anti_trick_gate_spec coverage
          --revision "${{ env.CWP_CI_REVISION }}" --policy .github/ci-test-policy.json
          --platform linux --platform windows
          cwp-evidence/*/collected.json cwp-evidence/*/executed.json
