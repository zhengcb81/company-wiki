name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/plans/**"
      - ".planning/**"
      - "docs/**/*.md"
      - "*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/plans/**"
      - ".planning/**"
      - "docs/**/*.md"
      - "*.md"

# Replace an older run when another commit arrives on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt "ruff==0.15.18"

      - name: Ruff lint
        run: ruff check src tests/unit tests/contract tests/e2e scripts tests/integration/test_narrative_runtime_e2e.py tests/support/narrative_model_fixture.py tools/check_dependencies.py tools/changed_unit_tests.py tools/pre_push_gate.py tools/summarize_junit_failures.py

      - name: Strict type check on src
        run: python -m mypy src

      - name: Compileall and config doctor
        run: |
          python -m compileall -q src scripts tests
          PYTHONPATH=src python scripts/config_doctor.py

      - name: Unit tests
        id: unit_tests
        run: |
          report="$RUNNER_TEMP/unit-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python -m pytest tests/unit -q --tb=short --junitxml="$report"

      - name: Unit test failure summary
        if: always()
        env:
          TEST_SUITE_NAME: unit tests
          TEST_SUITE_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          report="$RUNNER_TEMP/unit-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python tools/summarize_junit_failures.py "$report"

      - name: Focused contract tests
        id: contract_tests
        run: |
          report="$RUNNER_TEMP/contract-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python tools/pre_push_gate.py --fast-contracts-only --junitxml="$report"

      - name: Focused contract failure summary
        if: always()
        env:
          TEST_SUITE_NAME: focused contract tests
          TEST_SUITE_OUTCOME: ${{ steps.contract_tests.outcome }}
        run: |
          report="$RUNNER_TEMP/contract-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python tools/summarize_junit_failures.py "$report"

      - name: CLI smoke test
        run: |
          python scripts/snapshot_manifest.py --help
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "scripts/collect_news.py", "--help"],
              capture_output=True,
              text=True,
              check=False,
          )
          assert result.returncode == 78, (
              f"expected retired writer exit 78, got {result.returncode}: "
              f"{result.stdout}{result.stderr}"
          )
          assert "LEGACY WRITER BLOCKED" in result.stdout
          print("collect_news legacy writer remains blocked (exit 78)")
          PY

      - name: Scan for hardcoded secrets
        run: |
          if grep -rn 'sk-[0-9a-f]\{32\}' src/ scripts/ tests/ tools/ --include="*.py" | grep -v "test\|example\|placeholder\|your_"; then
            echo "WARNING: Potential hardcoded API key found"
            exit 1
          fi
          if grep -rn 'tvly-dev-[a-zA-Z0-9]\{20,\}' src/ scripts/ tests/ tools/ --include="*.py" | grep -v "test\|example\|placeholder\|your_"; then
            echo "WARNING: Potential hardcoded Tavily key found"
            exit 1
          fi
          echo "No hardcoded secrets found"
