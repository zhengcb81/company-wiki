name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install "ruff==0.15.18"

      - name: Ruff lint (WU-1.2)
        run: ruff check src tests/unit tests/contract scripts

      - name: Compileall + config doctor (WU-7.1)
        run: |
          python -m compileall -q src scripts tests
          PYTHONPATH=src python scripts/config_doctor.py

      - name: Unit tests
        run: python -m pytest tests/unit -q --tb=short

      - name: Contract tests
        run: python -m pytest tests/contract -q --tb=short

      - name: Unique test symbols gate (WU-1.1)
        run: python tools/check_unique_test_symbols.py

      - name: Plan claim verifier (WU-8.3)
        run: python tools/verify_plan_claims.py --plan-dir .

      - name: Mutation canaries (WU-7.1)
        run: |
          python -m pytest tests/contract/test_source_catalog_artifact_handle.py tests/contract/test_source_catalog_source_bundle.py tests/contract/test_source_catalog_download_authorization.py tests/contract/test_source_catalog_gap_plan.py tests/contract/test_source_catalog_fail_closed.py tests/contract/test_source_catalog_determinism.py -q

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CLI smoke test
        run: |
          python scripts/snapshot_manifest.py --help
          python scripts/collect_news.py --help || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          # Check for common secret patterns
          if grep -rn 'sk-[0-9a-f]\{32\}' scripts/ tests/ --include="*.py" | grep -v "test\|example\|placeholder\|your_"; then
            echo "WARNING: Potential hardcoded API key found"
            exit 1
          fi
          if grep -rn 'tvly-dev-[a-zA-Z0-9]\{20,\}' scripts/ tests/ --include="*.py" | grep -v "test\|example\|placeholder\|your_"; then
            echo "WARNING: Potential hardcoded Tavily key found"
            exit 1
          fi
          echo "No hardcoded secrets found"

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown for common issues
        run: |
          # Check for broken links in planning files
          for f in task_plan.md findings.md progress.md; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              # Just verify the files are valid UTF-8
              file "$f" | grep -q "UTF-8\|ASCII" || echo "WARNING: $f may not be valid UTF-8"
            fi
          done
