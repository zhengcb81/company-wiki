name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**/*.md"
      - "*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**/*.md"
      - "*.md"

# Replace an older run when another commit arrives on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt "ruff==0.15.18"

      - name: Ruff lint
        run: ruff check src tests/unit tests/contract tests/e2e scripts tests/integration/test_narrative_runtime_e2e.py tests/support/narrative_model_fixture.py tools/check_dependencies.py tools/changed_unit_tests.py tools/pre_push_gate.py tools/summarize_junit_failures.py

      - name: Strict type check on contract modules
        run: python -m mypy src/company_wiki/source_catalog/artifact_handle.py src/company_wiki/source_catalog/source_bundle.py src/company_wiki/source_catalog/runtime_policy.py src/company_wiki/source_catalog/activation.py src/company_wiki/source_catalog/close_gap.py src/company_wiki/source_catalog/policy_2x.py src/company_wiki/source_catalog/canary_registry.py src/company_wiki/source_catalog/normalized_meta.py src/company_wiki/source_catalog/flags.py src/company_wiki/source_catalog/policy.py src/company_wiki/source_catalog/restore.py src/company_wiki/source_catalog/operation_contract.py src/company_wiki/source_catalog/operation_projection.py src/company_wiki/source_catalog/source_operation.py src/company_wiki/source_catalog/source_reader.py src/company_wiki/source_catalog/narrative_document.py src/company_wiki/source_catalog/narrative_routing.py src/company_wiki/source_catalog/narrative_candidates.py src/company_wiki/source_catalog/narrative_context.py src/company_wiki/source_catalog/narrative_budget.py src/company_wiki/source_catalog/narrative_group_candidates.py src/company_wiki/source_catalog/narrative_neighbors.py src/company_wiki/source_catalog/narrative_finalize.py src/company_wiki/source_catalog/narrative_pdf_groups.py src/company_wiki/source_catalog/narrative_replay.py src/company_wiki/source_catalog/narrative_evidence.py src/company_wiki/source_catalog/transcript_tool_contract.py src/company_wiki/source_catalog/transcript_import.py src/company_wiki/source_catalog/transcript_text_extract.py src/company_wiki/source_catalog/transcript_lineage.py src/company_wiki/source_catalog/transcript_material.py src/company_wiki/source_catalog/transcript_import_cli.py src/company_wiki/automation/narrative_contracts.py src/company_wiki/automation/execution_snapshot.py src/company_wiki/automation/execution_context.py src/company_wiki/automation/worker.py src/company_wiki/automation/registry.py src/company_wiki/automation/planner.py src/company_wiki/automation/cli.py src/company_wiki/automation/narrative_select.py src/company_wiki/automation/narrative_model.py src/company_wiki/automation/narrative_summarize.py src/company_wiki/automation/narrative_source_guard.py src/company_wiki/automation/narrative_verify.py src/company_wiki/automation/narrative_runtime.py

      - name: Compileall and config doctor
        run: |
          python -m compileall -q src scripts tests
          PYTHONPATH=src python scripts/config_doctor.py

      - name: Unit tests
        id: unit_tests
        run: |
          report="$RUNNER_TEMP/unit-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python -m pytest tests/unit -q --tb=short --junitxml="$report"

      - name: Unit test failure summary
        if: always()
        env:
          TEST_SUITE_NAME: unit tests
          TEST_SUITE_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          report="$RUNNER_TEMP/unit-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python tools/summarize_junit_failures.py "$report"

      - name: Focused contract tests
        id: contract_tests
        run: |
          report="$RUNNER_TEMP/contract-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python tools/pre_push_gate.py --fast-contracts-only --junitxml="$report"

      - name: Focused contract failure summary
        if: always()
        env:
          TEST_SUITE_NAME: focused contract tests
          TEST_SUITE_OUTCOME: ${{ steps.contract_tests.outcome }}
        run: |
          report="$RUNNER_TEMP/contract-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xml"
          python tools/summarize_junit_failures.py "$report"

      - name: CLI smoke test
        run: |
          python scripts/snapshot_manifest.py --help
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "scripts/collect_news.py", "--help"],
              capture_output=True,
              text=True,
              check=False,
          )
          assert result.returncode == 78, (
              f"expected retired writer exit 78, got {result.returncode}: "
              f"{result.stdout}{result.stderr}"
          )
          assert "LEGACY WRITER BLOCKED" in result.stdout
          print("collect_news legacy writer remains blocked (exit 78)")
          PY

      - name: Scan for hardcoded secrets
        run: |
          if grep -rn 'sk-[0-9a-f]\{32\}' scripts/ tests/ --include="*.py" | grep -v "test\|example\|placeholder\|your_"; then
            echo "WARNING: Potential hardcoded API key found"
            exit 1
          fi
          if grep -rn 'tvly-dev-[a-zA-Z0-9]\{20,\}' scripts/ tests/ --include="*.py" | grep -v "test\|example\|placeholder\|your_"; then
            echo "WARNING: Potential hardcoded Tavily key found"
            exit 1
          fi
          echo "No hardcoded secrets found"
