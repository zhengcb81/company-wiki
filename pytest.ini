[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    real_data: requires the owner's live company-wiki catalog or raw roots
    requires_corpus: requires the owner's cross-repository golden corpus
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    unit: marks tests as unit tests
    live: invokes a real external provider and requires explicit owner configuration
    public_owner: offline fixture against pinned public owner commands
    owner_local_checkout: requires an authorized private or separately deployed owner checkout
    p4_fixture: isolated P4 synthetic catalog and receipt checks
    profile_benchmark: bounded local fixture throughput benchmark
    safetensors_backend: offline CPU tensor round-trip with a pinned optional dependency
    deployed_pdf_runtime: requires an explicitly configured deployed PDF/OCR backend
    coverage_artifact: requires a freshly measured FC-1204 branch coverage artifact
    retirement_protocol: requires a released R9 retirement observation window
    windows_native: asserts Windows-only OS behavior
    posix_native: asserts POSIX-only OS behavior
    requires_symlink: requires the host to grant symbolic link creation
asyncio_mode = auto
